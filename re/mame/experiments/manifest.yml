# Small, directly runnable experiments exposed by `python tools/oa.py trace`.
# These are intentionally small, deterministic probes. The state capture is
# the normal output; use --capture ram/full only when a probe needs forensic
# memory or VDP data.
version: 1

boot_scenarios:
  first-level:
    input: "none*320,start*5,none*200,start*5,none*170,start*5,none*200,start*5,none*150,start*5,none*180"

experiments:
  - name: title-menu
    description: Boot and advance through the opening menu screens.
    frames: 360
    input: "none*120,start*5,none*120,start*5,none*110"

  - name: player-run
    description: Enter the first stage and hold right during the initial run.
    frames: 1400
    regression:
      checkpoint: gameplay_checkpoint
      fields:
        - player.x
        - player.y
        - player.vx
        - player.vy
        - player.grounded
        - player.frame_ptr
        - player.animation_pc
        - player.animation_timer
    boot:
      scenario: first-level
    setup:
      - wait:
          symbol: PLAYER_ANIMATION_PC
          greater_than: 0
          timeout: 120
      - marker: gameplay_checkpoint
    actions:
      - input:
          right: true
          frames: 120
      - capture:
          until:
            symbol: PLAYER_X
            greater_than: 0
          timeout: 120

  - name: player-jump
    description: Enter the first stage, run briefly, press jump, and capture the arc.
    frames: 1400
    regression:
      checkpoint: gameplay_checkpoint
      fields:
        - player.x
        - player.y
        - player.world_x
        - player.world_y
        - player.vx
        - player.vy
        - player.grounded
        - player.frame_ptr
        - player.animation_pc
        - player.animation_timer
        - camera.x
        - camera.y
    boot:
      scenario: first-level
    setup:
      - wait:
          symbol: PLAYER_ANIMATION_PC
          greater_than: 0
          timeout: 120
      - marker: gameplay_checkpoint
    actions:
      - input:
          right: true
          frames: 30
      - input:
          c: true
          frames: 1
      - wait:
          condition:
            symbol: PLAYER_VY
            less_than: 0
          timeout: 30
      - marker: jump_started
      - capture:
          until:
            symbol: PLAYER_VY
            equals: 0
          timeout: 120

  - name: terrain-flat-ground
    description: Capture the resolver and response state while standing on the opening ground.
    frames: 1400
    boot:
      scenario: first-level
    setup:
      - wait:
          symbol: PLAYER_ANIMATION_PC
          greater_than: 0
          timeout: 180
    actions:
      - input:
          frames: 1
      - input:
          right: true
          frames: 1
      - input:
          frames: 48
      - marker: flat_ground

  - name: terrain-walk-off-edge
    description: Hold right long enough to leave the opening surface and record the falling transition.
    frames: 1800
    regression:
      checkpoint: walk_off_start
      fields:
        - player.x
        - player.y
        - player.world_x
        - player.world_y
        - player.vx
        - player.vy
        - player.grounded
        - camera.x
        - camera.y
    boot:
      scenario: first-level
    setup:
      - wait:
          symbol: PLAYER_ANIMATION_PC
          greater_than: 0
          timeout: 180
    actions:
      - marker: walk_off_start
      - input:
          right: true
          frames: 240
      - marker: walked_off_edge
      - input:
          right: true
          frames: 80

  - name: terrain-jump-land
    description: Capture jump ascent, apex, fall, and the exact landing handler state.
    frames: 1500
    regression:
      checkpoint: jump_test_start
      fields:
        - player.x
        - player.y
        - player.world_x
        - player.world_y
        - player.vx
        - player.vy
        - player.grounded
        - camera.x
        - camera.y
    boot:
      scenario: first-level
    setup:
      - wait:
          symbol: PLAYER_ANIMATION_PC
          greater_than: 0
          timeout: 180
    actions:
      - marker: jump_test_start
      - input:
          right: true
          frames: 30
      - input:
          right: true
          c: true
          frames: 1
      - wait:
          symbol: PLAYER_VY
          condition: negative
          timeout: 60
      - marker: jump_started
      - wait:
          symbol: PLAYER_VY
          greater_equal: 0
          timeout: 120
      - marker: jump_apex
      - wait:
          symbol: TERRAIN_LANDING_STATE
          equals: 1
          timeout: 120
      - marker: jump_landed

  - name: terrain-handler-30
    description: Exercise the exact landing-response handler through a runtime terrain-table fixture.
    frames: 1310
    boot:
      scenario: first-level
    pokes:
      # The fixture starts from the known opening-ground checkpoint at frame
      # 1300, then changes the selected floor-table byte from 0x11 to 0x30.
      frame: 1300
      memory:
        - symbol: WORLD_CAMERA_X
          value: 16
          width: u16
        - symbol: WORLD_CAMERA_Y
          value: 464
          width: u16
        - symbol: PLAYER_X
          value: 87
          width: u16
        - symbol: PLAYER_Y
          value: 416
          width: u16
        - symbol: PLAYER_WORLD_X
          value: 103
          width: u16
        - symbol: PLAYER_WORLD_Y
          value: 880
          width: u16
        - symbol: PLAYER_VY
          value: 512
          width: u16
        - symbol: TERRAIN_LANDING_STATE
          value: 1
          width: u8
        - symbol: SCENE_STATE
          value: 1
          width: u8
        # Row 40/column 7 contains map word 0x6C20, so the resolver indexes
        # TERRAIN_BEHAVIOR_INDEX_TABLE + (0x6C20 >> 1) = +0x3610.
        - symbol: TERRAIN_BEHAVIOR_INDEX_TABLE
          offset: 0x3610
          value: 48
          width: u8

  - name: terrain-handler-2b
    description: Exercise the accepted stop-and-align terrain handler at its level-01 cell.
    frames: 1310
    boot:
      scenario: first-level
    pokes:
      frame: 1300
      memory:
        - symbol: WORLD_CAMERA_X
          value: 2740
          width: u16
        - symbol: WORLD_CAMERA_Y
          value: 312
          width: u16
        - symbol: PLAYER_X
          value: 162
          width: u16
        - symbol: PLAYER_Y
          value: 408
          width: u16
        - symbol: PLAYER_WORLD_X
          value: 2902
          width: u16
        - symbol: PLAYER_WORLD_Y
          value: 720
          width: u16
        - symbol: PLAYER_VY
          value: 0
          width: u16
        # The accepted handler requires the landing state to be clear.
        - symbol: TERRAIN_LANDING_STATE
          value: 0
          width: u8
        - symbol: SCENE_STATE
          value: 1
          width: u8
        # Row 30/column 182 contains map word 0x6008, which indexes +0x3004
        # in the runtime behavior table and naturally selects behavior 0x2B.
        - symbol: TERRAIN_BEHAVIOR_INDEX_TABLE
          offset: 0x3004
          value: 43
          width: u8

