# Repeatable runtime coverage scenarios for the local USA/NTSC ROM.
#
# Inputs are frame tokens understood by trace_boot.lua.  Keep this file
# ROM-independent: it describes controller actions, not copyrighted data.

version: 1

defaults:
  capture_vdp: true
  trace_rnc_loads: true
  trace_scene_states: true

scenarios:
  - name: title-menu
    description: Boot and advance through the opening menu screens.
    frames: 360
    input: "none*120,start*5,none*120,start*5,none*110"

  - name: first-gameplay
    description: Enter the first stage and hold right long enough to load gameplay assets.
    frames: 720
    input: "none*30,start*90,none*60,right*120,none*420"

  - name: gameplay-progression
    description: Exercise repeated start transitions and a long movement interval.
    frames: 1550
    input: "none*320,start*5,none*200,start*5,none*170,start*5,none*200,start*5,none*150,start*5,none*180,right*1400,none*255"

  - name: story-to-first-level
    description: Replay the confirmed opening cadence through the first-level story/title sequence.
    frames: 1245
    input: "none*320,start*5,none*200,start*5,none*170,start*5,none*200,start*5,none*150,start*5,none*180"

  - name: combat-and-death
    description: Enter the first stage, traverse into the guard encounter, and exercise the confirmed sword-hit/death path.
    frames: 1690
    input: "none*320,start*5,none*200,start*5,none*170,start*5,none*200,start*5,none*150,start*5,none*180,right*390,a*2,none*18,a*2,none*18,a*2,none*18,a*2,none*18,a*2,none*100"

  - name: long-gameplay-traversal
    description: Long low-level traversal probe with repeated attack input; useful for discovering later scene/resource transitions.
    frames: 5000
    input: "none*320,start*5,none*200,start*5,none*170,start*5,none*200,start*5,none*150,start*5,none*180,right+a*3755"
