# Row-by-row comparison of native Engine::update() against the recovered
# Game_FrameUpdateLoop. This is an audit artifact, not a claim that the native
# phase names are the ROM scheduler.
format: openaladdin-native-scheduler-mapping-v1
recorded_at: 2026-08-27
repository_commit: 62858500db4a8b90210d603c659b2f168773ffc8
rom_scheduler: re/scheduler/frame_phases.yml
native_source: src/engine.cpp
status: incremental-ordinal-30-service

status_legend:
  exact: native operation has the same service and ordering role as the ROM call
  inlined: ROM service is represented inside another native phase
  derived_presentation_only: native work has no gameplay-state counterpart
  temporary_parity_hack: native behavior exists to preserve a measured boundary and still needs a ROM gate/lifecycle explanation
  mismatch: native service exists, but its split, order, or invocation count differs from the ROM call sequence
  unknown: no defensible native equivalent has been established
  unresolved_dead_state: retained compatibility state with no current writer or observed effect

