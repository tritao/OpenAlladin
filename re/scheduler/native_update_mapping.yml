# Row-by-row comparison of native Engine::update() against the recovered
# Game_FrameUpdateLoop. This is an audit artifact, not a claim that the native
# phase names are the ROM scheduler.
format: openaladdin-native-scheduler-mapping-v1
recorded_at: 2026-08-27
repository_commit: 62858500db4a8b90210d603c659b2f168773ffc8
rom_scheduler: re/scheduler/frame_phases.yml
native_source: src/engine.cpp
status: static-audit-no-code-change

status_legend:
  exact: native operation has the same service and ordering role as the ROM call
  inlined: ROM service is represented inside another native phase
  derived_presentation_only: native work has no gameplay-state counterpart
  temporary_parity_hack: native behavior exists to preserve a measured boundary and still needs a ROM gate/lifecycle explanation
  mismatch: native service exists, but its split, order, or invocation count differs from the ROM call sequence
  unknown: no defensible native equivalent has been established

rom_rows:
  - ordinal: 1
    rom_service: "0x001A91C6 input/resource service"
    native_equivalent: "terrain_input plus frame-boundary deferred spawn prelude"
    status: mismatch
    evidence: "update_terrain_input covers controller/query bytes; F5/resource work is split into deferred_animation_spawn and later animation_spawn"
  - ordinal: 2
    rom_service: "0x001A8E0C publish player world coordinates"
    native_equivalent: "player_world_x/player_world_y reads and sync_player_actor at state boundary"
    status: mismatch
    evidence: "native does not expose the ROM's early publish call as a scheduler phase; actor slot 0 is republished at the end of update"
  - ordinal: 3
    rom_service: "0x001AD7B4 landing contour resolver"
    native_equivalent: "terrain_contour -> apply_floor_contour"
    status: exact
    evidence: "native phase is recorded at the same pre-motion position on the normal path"
  - ordinal: 4
    rom_service: "0x001A8E0C publish player world coordinates"
    native_equivalent: "cached player_world_x/player_world_y values"
    status: inlined
    evidence: "native consumers use the same world-coordinate conversion after contour resolution without a separate publish service"
  - ordinal: 5
    rom_service: "0x001AD632 terrain edge/ceiling probe"
    native_equivalent: "query_player_collision during terrain_input"
    status: inlined
    evidence: "collision probes are populated from the level query immediately before connector response"
  - ordinal: 6
    rom_service: "0x001A986E terrain vertical response"
    native_equivalent: "update_terrain_connector_response"
    status: exact
    evidence: "behavior-0x22 query latch is consumed with the recovered +/-1, +/-2 local-Y cadence"
  - ordinal: 7
    rom_service: "0x001A99F0 terrain horizontal response"
    native_equivalent: "apply_ground_movement plus integrate_motion response branch"
    status: inlined
    evidence: "native separates the ground step and fixed-point response across the physics block"
  - ordinal: 8
    rom_service: "0x001ADE36 MovementVM_TickActors"
    native_equivalent: "movement_vm"
    status: exact
    evidence: "direct ROM entry is recorded at the recovered position"
  - ordinal: 9
    rom_service: "0x001ADB5C actor terrain collision loop"
    native_equivalent: "actor_terrain plus actor_terrain_interaction"
    status: mismatch
    evidence: "one ROM loop is split into a general terrain pass and a Type-0x2D interaction conversion pass"
  - ordinal: 10
    rom_service: "0x001ABB40 actor/player collision pass"
    native_equivalent: "player_actor_interaction"
    status: exact
    evidence: "native calls update_actor_interactions at the corresponding gameplay position"
  - ordinal: 11
    rom_service: "0x001B321C query down"
    native_equivalent: "query_player_collision flags"
    status: inlined
    evidence: "native derives directional collision flags in the terrain query block"
  - ordinal: 12
    rom_service: "0x001B3212 query up"
    native_equivalent: "query_player_collision flags"
    status: inlined
    evidence: "native derives directional collision flags in the terrain query block"
  - ordinal: 13
    rom_service: "0x001B3226 query left"
    native_equivalent: "query_player_collision flags"
    status: inlined
    evidence: "native derives directional collision flags in the terrain query block"
  - ordinal: 14
    rom_service: "0x001B3230 query right"
    native_equivalent: "query_player_collision flags"
    status: inlined
    evidence: "native derives directional collision flags in the terrain query block"
  - ordinal: 15
    rom_service: "0x001B1E38 Terrain_ResolvePlayerCell"
    native_equivalent: "terrain_behavior prepass plus terrain_resolution"
    status: mismatch
    evidence: "native may resolve before actor/refill work and again after integration; ROM direct loop has one ordinal-15 call, with handler timing still split in native"
  - ordinal: 16
    rom_service: "0x001A9D98 player terrain response state machine"
    native_equivalent: "player_movement response/integration block"
    status: inlined
    evidence: "native records player_movement at the response boundary but combines state-machine branches with the integrator"
  - ordinal: 17
    rom_service: "0x001A9716 jump and vertical state"
    native_equivalent: "start_jump and vertical handoff inside player_movement"
    status: inlined
    evidence: "jump impulse and response-latch writes are applied after integration and terrain resolution"
  - ordinal: 18
    rom_service: "0x001A8E0C publish player world coordinates"
    native_equivalent: "refreshed world-coordinate reads before camera/VM work"
    status: inlined
    evidence: "native context is rebuilt from current player/camera state rather than calling a separate publisher"
  - ordinal: 19
    rom_service: "0x001AA8FA Camera_UpdateFollow"
    native_equivalent: "camera_follow"
    status: exact
    evidence: "native records the follow service and carries the recovered delay/rebase rules"
  - ordinal: 20
    rom_service: "0x001A9304 locomotion/action selector"
    native_equivalent: "desired_pose selection and action/locomotion branch logic"
    status: inlined
    evidence: "native chooses the same stream families in the player animation preparation block"
  - ordinal: 21
    rom_service: "0x001A9502 action animation selector"
    native_equivalent: "grounded Up/attack/apple stream selection"
    status: inlined
