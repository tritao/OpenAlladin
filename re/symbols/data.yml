# Address-keyed data knowledge. Hardware names are deliberately explicit so
# both Ghidra and MAME can use the same names.
0xFF0000:
  name: WORK_RAM_BASE
  type: address
  confidence: confirmed
  description: Base address of the 68000 work RAM window.

0xA10003:
  name: IO_PORT1_DATA
  type: u8
  confidence: confirmed
  description: Controller port 1 data register

0xA11100:
  name: Z80_BUS_REQUEST
  type: u16
  confidence: confirmed
  description: Z80 bus request register

0xA00036:
  name: Z80_SOUND_QUEUE_CURSOR
  type: u8
  confidence: confirmed
  description: 64-byte Z80 sound-command queue cursor updated by the 68000 audio send helpers.
  evidence:
    - ghidra_audio_queue_decompile
    - mame_audio_mailbox_queue_trace

0xA01B40:
  name: Z80_SOUND_COMMAND_QUEUE
  type: u8[64]
  confidence: confirmed
  description: Shared Z80 sound-command ring buffer. Entries begin with 0xFF, followed by a queue opcode and an 8-bit sound command ID.
  evidence:
    - ghidra_audio_queue_decompile
    - mame_audio_mailbox_queue_trace

0xA11200:
  name: Z80_RESET
  type: u16
  confidence: confirmed
  description: Z80 reset register

0xC00000:
  name: VDP_DATA
  type: u16
  confidence: confirmed
  description: VDP data port

0xC00004:
  name: VDP_CONTROL
  type: u16
  confidence: confirmed
  description: VDP control port

0x004554:
  name: TERRAIN_RESPONSE_HANDLER_TABLE
  type: rom_pointer_table
  confidence: confirmed
  description: 72-entry four-byte table indexed by the terrain behavior byte read from TERRAIN_BEHAVIOR_INDEX_TABLE; handlers update terrain flags, player velocity, alignment, animation, and actor spawns.
  evidence:
    - rom_terrain_handler_table_004554
    - ghidra_disassembly_001B1E38

0x004954:
  name: ACTOR_VM_DISPATCH_TABLE
  type: rom_pointer_table
  confidence: confirmed
  description: Shared 21-entry pointer table used by AnimationVM command bytes EA-FE and MovementVM command bytes 80-94.
  evidence:
    - ghidra_animation_vm_001AC784
    - ghidra_actor_movement_vm_001ADE36
    - animation_stream_decoder

0x004154:
  name: INTERACTION_HANDLER_TABLE
  type: rom_pointer_table
  confidence: confirmed
  description: Pointer table used by the two interaction-table row processors for non-zero scene interaction values.
  evidence:
    - ghidra_decompile_collision_damage_targets


0xFF9884:
