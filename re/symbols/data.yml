# Address-keyed data knowledge. Hardware names are deliberately explicit so
# both Ghidra and MAME can use the same names.
0xFF0000:
  name: WORK_RAM_BASE
  type: address
  confidence: confirmed
  description: Base address of the 68000 work RAM window.

0xA10003:
  name: IO_PORT1_DATA
  type: u8
  confidence: confirmed
  description: Controller port 1 data register

0xA10009:
  name: IO_PORT1_CONTROL
  type: u8
  confidence: confirmed
  description: Controller port 1 control register used to select the Genesis controller sampling phases.

0xA11100:
  name: Z80_BUS_REQUEST
  type: u16
  confidence: confirmed
  description: Z80 bus request register

0xA00036:
  name: Z80_SOUND_QUEUE_CURSOR
  type: u8
  confidence: confirmed
  description: 64-byte Z80 sound-command queue cursor updated by the 68000 audio send helpers.
