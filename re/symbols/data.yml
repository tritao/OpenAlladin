# Address-keyed data knowledge. Hardware names are deliberately explicit so
# both Ghidra and MAME can use the same names.
0xFF0000:
  name: WORK_RAM_BASE
  type: address
  confidence: confirmed
  description: Base address of the 68000 work RAM window.

0xA10003:
  name: IO_PORT1_DATA
  type: u8
  confidence: confirmed
  description: Controller port 1 data register

0xA10009:
  name: IO_PORT1_CONTROL
  type: u8
  confidence: confirmed
  description: Controller port 1 control register used to select the Genesis controller sampling phases.

0xA11100:
  name: Z80_BUS_REQUEST
  type: u16
  confidence: confirmed
  description: Z80 bus request register

0xA00036:
  name: Z80_SOUND_QUEUE_CURSOR
  type: u8
  confidence: confirmed
  description: 64-byte Z80 sound-command queue cursor updated by the 68000 audio send helpers.
  evidence:
    - ghidra_audio_queue_decompile
    - mame_audio_mailbox_queue_trace

0xA01B40:
  name: Z80_SOUND_COMMAND_QUEUE
  type: u8[64]
  confidence: confirmed
  description: Shared Z80 sound-command ring buffer. Entries begin with 0xFF, followed by a queue opcode and an 8-bit sound command ID.
  evidence:
    - ghidra_audio_queue_decompile
    - mame_audio_mailbox_queue_trace

0xA01B20:
  name: Z80_AUDIO_BANK_WINDOW_LOCK
  type: u8
  format: boolean
  confidence: decompiled
  description: 68000-held lock flag for the Z80 audio driver's banked-ROM window; Audio_AcquireZ80BankWindow sets bit 0 and Audio_ReleaseZ80BankWindow clears it around protected render-side work.
  evidence:
    - ghidra_decompile_001E56C0
    - ghidra_decompile_001E56FE
    - z80_bank_window_helper_01F9

0xA01B21:
  name: Z80_AUDIO_BANK_WINDOW_BUSY
  type: u8
  format: boolean
  confidence: decompiled
  description: Z80-side busy flag for the audio driver's banked-ROM window; Audio_AcquireZ80BankWindow waits for bit 0 to clear before returning with the lock held.
  evidence:
    - ghidra_disassembly_001E56C0
    - z80_bank_window_helper_01F9

0xA11200:
  name: Z80_RESET
  type: u16
  confidence: confirmed
  description: Z80 reset register

0xC00000:
  name: VDP_DATA
  type: u16
  confidence: confirmed
  description: VDP data port

0xC00004:
  name: VDP_CONTROL
  type: u16
  confidence: confirmed
  description: VDP control port

0x002C78:
  name: LEVEL_TABLE
  type: rom_table
  entry_size: 66
  count: 13
  confidence: confirmed
  description: 66-byte level records indexed by SCENE_STATE during Level_LoadFromSceneState; records contain start/camera offsets, compressed terrain/map resources, palette, block dimensions, music, per-frame/camera-scroll callbacks, and an exit callback.
  evidence:
    - rom_level_table_002C78
    - ghidra_disassembly_001AA484
    - asset_extractor_levels_json

0x004554:
  name: TERRAIN_RESPONSE_HANDLER_TABLE
  type: rom_pointer_table
  confidence: confirmed
  description: 256-entry four-byte table indexed by the terrain behavior byte read from TERRAIN_BEHAVIOR_INDEX_TABLE; handlers update terrain flags, player velocity, alignment, animation, and actor spawns. Most entries select the common no-op handler at 0x001B65BE.
  evidence:
    - rom_terrain_handler_table_004554
    - ghidra_disassembly_001B1E38
    - rom_terrain_handler_table_extent_004554_004953

