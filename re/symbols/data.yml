  description: Table of actor sprite VRAM base addresses in 0x80-byte increments, from 0x8600 through 0xA580. Actor_AllocateSpriteVRAM indexes it by the selected resource-slot start and stores the result in actor offset +0x2E; the renderer uses that value as the actor's sprite tile base.
