    - mame_natural_actor_type_2D_trace
0x001AE30A:
  name: Actor_InitializeFromTemplate
  confidence: confirmed
  description: Copies a 0x42-byte actor template into a destination actor record; A5 is the destination and A6 is the source template.
  evidence:
