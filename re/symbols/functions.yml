    - mame_actor_initializer_trace
0x001AE372:
  name: Actor_ClearOwnedResources
  confidence: confirmed
  description: Clears the actor-owned resource/link list at actor offset 0x2A using the template-owned count at offset 0x29, then releases the list pointers.
