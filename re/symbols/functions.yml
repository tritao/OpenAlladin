# Address-keyed function knowledge. Keep confidence/evidence with every fact.
# Example:
# 0x017C92:
#   name: Actor_ApplyHorizontalMovement
#   confidence: provisional
#   evidence: [mame_trace_run_right]
0x001A9502:
  name: Player_SelectActionAnimation
  confidence: confirmed
  description: Selects the player's action animation stream from the global player-state flags, resets PLAYER_ANIMATION_TIMER, and arms the ten-frame action delay; the sword branch assigns PLAYER_ANIM_SWORD at 0x0012271A.
  evidence:
    - ghidra_decompile_actor_combat_targets
    - ghidra_disassembly_001A9502
    - mame_player_state_trace
0x001AC0D2:
  name: Actor_EnterType84Animation12319C
  confidence: confirmed
  description: Shared actor transition block that clears the current type, releases owned resources, performs the common actor cleanup, then installs type 0x84 with animation stream 0x0012319C and clears the animation timer.
  evidence:
    - ghidra_disassembly_001AC0D2
    - ghidra_decompile_actor_combat_targets
0x001AC3F2:
  name: Actor_ToggleHorizontalFacing
  confidence: confirmed
  description: If actor flag bit 6 at offset 0x06 is clear, sets that bit and XORs the actor horizontal-facing byte at offset 0x09 with 0xFF.
  evidence:
    - ghidra_decompile_actor_combat_targets
    - ghidra_disassembly_001AC3F2
0x001ACBF2:
  name: Actor_SelectDirectionalAnimation
  confidence: confirmed
  description: Compares actor position field +0x02 against the global word at 0x00FF7E02 and, subject to 0x00FF7E49, loads animation stream 0x00125966 into A2.
  evidence:
    - ghidra_disassembly_001ACBF2
    - ghidra_decompile_actor_combat_targets
0x001ABB40:
  name: Actor_PlayerCollisionPass
  confidence: confirmed
  description: Per-frame player collision pass. It derives the player collision bounds, scans 24 actor records at 0x00FF7E82 with stride 0x42, checks their frame rectangles, and dispatches a hit through the handler table at ROM address 0x001CBE.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001ABB40
    - mame_guard_collision_watchpoint
0x001ABD7E:
  name: Actor_ActorCollisionPass
  confidence: confirmed
  description: Scans seven records at 0x00FF84B2 against the 24 records at 0x00FF7E82, performs frame-rectangle overlap tests, and dispatches the receiving actor through the handler table at ROM address 0x001EBA.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001ABD7E
0x001ABE8A:
  name: Actor_HandleType2DInteraction
  confidence: confirmed
  description: Handles the type-0x2D interaction branch and reinitializes the actor from the shared template at 0x001B7E40, preserving the actor position and applying the player-facing bit when required.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001ABE8A
0x001AE3FC:
  name: InteractionTable_ProcessRowsA
  confidence: confirmed
  description: Processes 16 interaction-table entries from the current scene row. Non-zero values from 0x00FFAE87 select a four-byte handler from the table at ROM address 0x004154.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001AE3FC
0x001AE47E:
  name: InteractionTable_ProcessRowsB
  confidence: confirmed
  description: Processes the second interaction-table row group, scanning 23 entries from 0x00FFAE87 and dispatching non-zero values through the same ROM handler table at 0x004154.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001AE47E
0x001AE4F8:
  name: Player_ProcessInteractionState
  confidence: confirmed
  description: Gates player interaction-state recovery on the global collision flags, selects player animation streams 0x001226CE or 0x001226B2, and invokes the player interaction helper at 0x001B03F2.
  evidence:
    - ghidra_decompile_collision_damage_targets
    - ghidra_disassembly_001AE4F8
0x001AE9C6:
  name: ActorType0A_PlayerCollisionHandler
  confidence: confirmed
  description: Handler-table entry for actor type 0x0A at ROM pointer-table address 0x001CE6. It calls the shared actor response block at 0x001AEC00 and then processes player interaction state through 0x001AE4F8.
  evidence:
    - rom_player_collision_handler_table_001CBE
    - ghidra_disassembly_001AE9C6
    - ghidra_decompile_collision_damage_targets
0x001AEC00:
  name: Actor_HandlePlayerCollisionBlock
  confidence: confirmed
  description: Shared player-collision response block. It checks the active collision state and actor-side position, decrements the actor timer at +0x01 when present, and routes terminal actor states through type-0x84 cleanup/initialization branches.
  evidence:
    - ghidra_disassembly_001AEC00
    - ghidra_decompile_collision_damage_targets
    - mame_guard_collision_watchpoint
0x001AE0B0:
  name: Actor_CullAndRemoveLinked
  confidence: confirmed
  description: Clears an actor record, releases its owned resources, publishes its interaction value when required, and repeats the removal for a linked actor at offset 0x3E.
  evidence:
    - ghidra_decompile_actor_combat_targets
    - ghidra_disassembly_001AE0B0
    - ghidra_disassembly_001ADEDE
0x001AE6BC:
  name: Actor_PublishInteractionValueA2
  confidence: confirmed
  description: If actor register A2 has a non-zero value at offset 0x34, publishes it to the global interaction table at 0x00FFAE87 indexed by the actor word at offset 0x32.
  evidence:
    - ghidra_disassembly_001AE6BC
    - ghidra_decompile_actor_combat_targets
0x001AE6DE:
  name: Actor_PublishInteractionValue
  confidence: confirmed
  description: If actor register A1 has a non-zero value at offset 0x34, publishes it to the global interaction table at 0x00FFAE87 indexed by the actor word at offset 0x32.
  evidence:
    - ghidra_decompile_actor_combat_targets
    - ghidra_disassembly_001AE6DE
0x001A9716:
  name: Player_HandleJumpAndVerticalState
  confidence: confirmed
  description: Handles the player's jump/vertical state and initializes PLAYER_VY for a jump.
  evidence:
    - ghidra_disassembly_001A9716
    - mame_debug_watch_player_vy
0x001A9B90:
  name: Player_IntegrateMotion
  confidence: confirmed
  description: Integrates horizontal and vertical player motion; its vertical path updates PLAYER_Y from PLAYER_VY.
  evidence:
    - ghidra_disassembly_001A9B90
    - mame_debug_watch_player_y
0x001AC784:
  name: AnimationVM_TickActors
  confidence: confirmed
  description: Common actor animation interpreter; starts at the actor table and advances each record by 0x42 bytes.
  evidence:
    - ghidra_disassembly_001AC784
    - mame_player_state_trace
0x001AD00E:
  name: AnimationVM_SpawnOrCopyActor
  confidence: confirmed
  description: Handles animation opcode F5; selects or allocates an actor, initializes it from the template at A2, then consumes signed spawn offsets and optional animation/movement overrides.
  evidence:
    - ghidra_disassembly_001AD00E
    - mame_type_2D_spawn_trace_1800
0x001ADE36:
  name: MovementVM_TickActors
  confidence: confirmed
  description: Common actor movement interpreter; iterates actor records and consumes each non-null movement_pc stream at actor offset 0x0A.
  evidence:
