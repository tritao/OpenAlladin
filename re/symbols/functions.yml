0x00000200:
  name: System_AccumulateRomChecksumAndSpin
  size: 26
  confidence: decompiled
  description: Non-returning post-header routine that accumulates one 16-bit ROM word per iteration from 0x00000200 into D3 for 0x000FFF00 iterations, then spins forever at 0x00000216; the reset vector instead enters System_ResetBootstrap at 0x0000021A, so no live caller or checksum consumer is claimed.
  evidence:
    - gnu_m68k_disassembly_00000200
    - startup_checksum_spin_static_v1
