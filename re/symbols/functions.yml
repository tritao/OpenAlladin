    - mame_guard_sword_hit_trace
0x001B3416:
  name: RNC_To_VDP_Loader
  confidence: confirmed
  description: Decompresses an RNC method-1 block at A0 and streams the result to the VDP VRAM byte address in A1.
  evidence:
