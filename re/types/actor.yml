name: Actor
size: 0x42
fields:
  0x00:
    name: type
    type: u8
    description: Actor type/state byte copied from template byte +0; zero marks a free record and non-zero values are processed by common actor logic.
  0x02:
    name: x
    type: u16
    description: World X coordinate written by the caller after Actor_InitializeFromTemplate; the template initializer deliberately leaves this destination field unchanged.
  0x04:
    name: y
    type: u16
    description: World Y coordinate written by the caller after Actor_InitializeFromTemplate; the template initializer deliberately leaves this destination field unchanged.
  0x09:
    name: facing_x_flip
    type: u8
    description: Horizontal facing/flip byte used by animation and movement state streams; the common animation VM copies it to spawned children.
  0x0a:
    name: movement_pc
    type: u32
    description: Movement state-stream cursor consumed by the common movement update; the template initializer copies its source long word into this field.
  0x0e:
    name: movement_loop_pc
    type: u32
    description: Movement-stream continuation cursor used by the shared loop/delay command handler; Actor_InitializeFromTemplate deliberately leaves it unchanged, so slot reuse can carry the prior cursor.
  0x12:
    name: movement_loop_timer
    type: u8
    description: Movement-stream loop/delay counter consumed by the shared movement command handler; Actor_InitializeFromTemplate deliberately leaves it unchanged on reuse.
  0x18:
    name: velocity_x
    type: u16
    description: Horizontal movement accumulator integrated by the common actor movement update.
  0x1a:
    name: velocity_y
    type: u16
    description: Vertical movement accumulator integrated by the common actor movement update.
  0x1e:
    name: sprite_attribute
    type: u16
    description: Raw Genesis SAT tile-attribute base copied from the actor template; bits 13..14 select the CRAM palette line and bit 15 selects sprite priority.
  0x14:
    name: collision_frame_ptr
    type: u32
    description: Current animation-frame/collision-record pointer written by the animation VM; Actor_InitializeFromTemplate clears it before the first animation service. Player/actor collision reads bounds from bytes +2..+5 of this record; the guard fixture resolves to ROM 0x001F6500.
  0x20:
    name: animation_pc
    type: u32
    description: ROM pointer to the current animation stream position.
  0x29:
    name: resource_count
    type: u8
    description: Template-owned resource/cleanup count consumed by the actor cleanup helper; the guard template initializes it to 9 and the shared type 0x84 death template to 6.
  0x35:
    name: facing_y_flip
    type: u8
    description: Vertical-facing/flip byte used by movement and animation state streams; the common animation VM copies it to spawned children.
  0x36:
    name: movement_command_timer
    type: u8
    description: Movement-stream command delay counter; the movement VM decrements it instead of consuming another command while it is non-zero.
  0x3c:
    name: flags
    type: u8
    description: Common actor behavior flags. The movement and animation code use individual bits for integration, parent/child linkage, and interaction state.
  0x38:
    name: movement_return_pc
    type: u32
    description: Return cursor used by movement-stream call/return command 0x92; Actor_InitializeFromTemplate deliberately leaves it unchanged so a recycled record retains the prior continuation until the caller overwrites it.
  0x37:
    name: animation_timer
    type: u8
    description: Animation delay counter consumed before the next stream command.
