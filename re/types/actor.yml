name: Actor
size: 0x42
fields:
  0x00:
    name: type
    type: u8
    description: Actor type/state byte copied from the object template; zero marks a free record and non-zero values are processed by common actor logic.
  0x20:
    name: animation_pc
    type: u32
    description: ROM pointer to the current animation stream position.
  0x37:
    name: animation_timer
    type: u8
    description: Animation delay counter consumed before the next stream command.
