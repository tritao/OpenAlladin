# ROM-resident Genesis Z80 sound-driver map. Addresses in this file are Z80
# program addresses unless explicitly marked as ROM addresses.
format: openaladdin-z80-sound-driver-v1

rom_copy:
  source_start: 0x001B8480
  source_end_inclusive: 0x001B9D06
  z80_destination: 0x0000
  size: 6279
  loader_68k: 0x001E573A

entry_points:
  reset_stub: 0x0000
  initialization: 0x08C3
  queue_consumer: 0x01D1
  command_dispatch: 0x0945

queue:
  write_cursor: 0x0036
  read_cursor: 0x0037
  data_base: 0x1B40
  size: 64
  packet_marker: 0xFF

command_handlers:
  0x00: 0x09D6
  0x01: 0x09EA
  0x02: 0x09F8
  0x03: 0x09FE
  0x04: 0x0A07
  0x05: 0x0A4B
  0x06: 0x0A54
  0x07: 0x0A6D
  0x0B: 0x0A96
  0x0C: 0x0AB1
  0x0D: 0x0AC9
  0x0E: 0x0ACF
  0x10: 0x0A84
  0x12: 0x0A8D
  0x14: 0x0AE6
  0x16: 0x0AF2
  0x17: 0x0B12
  0x1A: 0x0B4F
  0x1B: 0x0B64
  0x1C: 0x0B75
  0x1D: 0x0B7F
  0x1E: 0x0A10
  0x1F: 0x0BA8
  0x20: 0x0BB4

sequence_table:
  address: 0x001BAF6F
  entry_width: 2
  entry_count: 0x72
  entry_endianness: little
  header_buffer: 0x0BBD
  header_size: 0x21
  track_count_offset: 0
  track_offsets_offset: 1
  track_offset_count: 16
  track_offset_endianness: little
  base_address_is: 24-bit ROM address used by the banked read helper

# IDs confirmed by the Level 01 MAME command trace. The native runtime uses
# the level music ID when no --sound-id override is supplied.
sound_ids:
  level01_music: 0x49
  animation_sfx: 0x4C
  interaction_event: 0x31

channel_state:
  base: 0x1B80
  stride: 0x20
  count: 16
  stream_cache_window_offsets: [0, 1, 2]
  stream_pointer_offsets: [3, 4, 5]
  event_timer_offsets: [7, 8]
  signed_operand_a_offsets: [9, 10]
  signed_operand_b_offsets: [0x0B, 0x0C]
  sound_id_offset: 0x0E
  channel_index_offset: 0x0F

stream:
  event_dispatch: 0x04BC
  cached_byte_reader: 0x03EF
  cache_base_pointer: 0x0454
  cache_stride: 0x10
  cache_window_size: 0x10
  note_range: 0x00..0x5F
  control_range: 0x60..0x7F
  signed_operand_a_range: 0xC0..0xFF
  signed_operand_b_range: 0x80..0xBF
  signed_operand_group_bits: 6

rom_window:
  bank_register: 0x6000
  window_start: 0x8000
  window_end: 0xFFFF
  read_helper: 0x01F9
  bank_copy_helper: 0x023D

evidence:
  - ghidra_audio_queue_decompile
  - mame_audio_mailbox_queue_trace
  - z80_driver_command_dispatch_0945
