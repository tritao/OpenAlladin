[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openaladdin-genie"
version = "0.1.0"
description = "Genie reverse-engineering tooling for OpenAladdin"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.scripts]
genie = "genie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genie*"]

[tool.setuptools.package-data]
"genie.ghidra" = ["*.sh", "*.cmd"]
"genie.mame" = ["*.sh"]
